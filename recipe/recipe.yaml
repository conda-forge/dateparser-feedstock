schema_version: 1

context:
  version: "1.5.0"

package:
  name: dateparser
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dateparser/dateparser-${{ version }}.tar.gz
  sha256: 08d62f2c00d3a1e806fc59d40c79e7554e31d84d3b8c6145820af051c92e7292

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - dateparser-download = dateparser_cli.cli:entrance

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77.0
    - pip
  run:
    - python >=${{ python_min }}
    - python-dateutil >=2.7.0
    - pytz >=2024.2
    - regex >=2024.9.11
    - tzlocal >=0.2

tests:
  - python:
      imports:
        - dateparser
        - dateparser.calendars
        - dateparser.languages
        - dateparser.utils
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - dateparser-download --help

about:
  summary: Date parsing library designed to parse dates from HTML pages
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://pypi.org/project/dateparser/
  repository: https://github.com/scrapinghub/dateparser

extra:
  recipe-maintainers:
    - tacaswell
    - ocefpaf
